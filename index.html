<script>
    const SUPABASE_URL = "https://cxmfibseowubsmqdcixk.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_vip7m_r8weuMh5cARX88ng_uUzndPfF" 

    const supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
            auth: {
                autoRefreshToken: true,
                persistSession: true,
                detectSessionInUrl: true
            }
        }
    );
async function loginWithSupabase(email, password) {

    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

    if (error) {
        console.error("Login error:", error);
        alert("تعذر تسجيل الدخول: " + (error.message || "بيانات الدخول غير صحيحة"));
        return false;
    }

    const user = data.user;

    if (!user) {
        alert("تعذر تسجيل الدخول");
        return false;
    }

    const { data: profile, error: profileError } =
        await supabaseClient
            .from("profiles")
            .select("*")
            .eq("id", user.id)
            .single();

    if (profileError) {
        console.error("Profile error:", profileError);

        await supabaseClient.auth.signOut();

        alert("لم يتم العثور على صلاحيات المستخدم");
        return false;
    }

    if (!profile.is_active) {
        await supabaseClient.auth.signOut();

        alert("هذا الحساب غير فعال");
        return false;
    }

    console.log("Logged in:", profile);

    window.vendorCareUser = profile;

    return true;
}


async function logoutFromSupabase() {

    const { error } =
        await supabaseClient.auth.signOut();

    if (error) {
        console.error("Logout error:", error);
        return;
    }

    window.vendorCareUser = null;

    location.reload();
}


async function loadCurrentUser() {

    const {
        data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) {
        return null;
    }

    const { data: profile, error } =
        await supabaseClient
            .from("profiles")
            .select("*")
            .eq("id", user.id)
            .single();

    if (error) {
        console.error(error);
        return null;
    }

    window.vendorCareUser = profile;

    return profile;
}
</script>

function setLoginRole(role){
 loginRole=role;

 document.getElementById("ownerTab").classList.toggle("active",role==="owner");
 document.getElementById("companyTab").classList.toggle("active",role==="company");
 document.getElementById("companyCodeGroup").classList.toggle("hidden",role!=="company");
}

async function login(e){
 e.preventDefault();
 const btn=document.getElementById("loginSubmitBtn");
 const username=document.getElementById("loginUser").value.trim();
 const password=document.getElementById("loginPass").value;
 const code=document.getElementById("companyCode").value.trim().toUpperCase();
 if(!username || !password){ alert("أدخل اسم المستخدم وكلمة المرور"); return; }
 if(loginRole==="company" && !code){ alert("أدخل رمز الشركة"); return; }
 if(btn){ btn.disabled=true; btn.textContent="جاري تسجيل الدخول..."; }
 try{
   const email=loginRole==="owner" ? "alyas@vendorcare.app" : `${username.toLowerCase()}@vendorcare.app`;
   const ok=await loginWithSupabase(email,password);
   if(!ok) return;

   const profile=window.vendorCareUser;
   if(!profile){ throw new Error("تعذر قراءة بيانات المستخدم"); }

   if(loginRole==="owner"){
     if(profile.role!=="owner" || profile.is_active!==true){
       await logoutFromSupabase();
       alert("هذا الحساب ليس حساب المالك");
       return;
     }
     session={role:"owner",user:profile.username||"Alyas",companyId:null,userId:profile.id};
     startApp();
     return;
   }

   if(!profile.company_id || !["company_admin","technician","staff"].includes(profile.role)){
     await logoutFromSupabase();
     alert("هذا الحساب غير مرتبط بشركة. يجب إنشاء حساب للشركة أولاً.");
     return;
   }

   const {data:company,error}=await supabaseClient
     .from("companies")
     .select("id,name,code,is_active")
     .eq("id",profile.company_id)
     .single();

   if(error){
     console.error("Company lookup error:",error);
     await logoutFromSupabase();
     alert("تعذر الوصول إلى بيانات الشركة. تأكد من اتصال الإنترنت وإعدادات Supabase.");
     return;
   }

   if(!company || !company.is_active || String(company.code).toUpperCase()!==code){
     await logoutFromSupabase();
     alert("رمز الشركة غير صحيح أو الشركة غير فعالة");
     return;
   }

   ensureLocalCompany(company);
   session={role:"company",user:profile.username||username,companyId:company.id,userId:profile.id};
   startApp();
 }catch(err){
   console.error("Login failed:",err);
   try{ await supabaseClient.auth.signOut(); }catch(_e){}
   alert("حدث خطأ أثناء تسجيل الدخول: " + (err.message || "خطأ غير معروف"));
 }finally{
   if(btn){ btn.disabled=false; btn.textContent="دخول إلى النظام"; }
 }
}
function ensureLocalCompany(c){
 if(!db.companies) db.companies=[];
 let local=db.companies.find(x=>x.id===c.id);
 if(!local){
   local={id:c.id,code:c.code,name:c.name,phone:"",email:"",address:"",plan:"",start:"",end:"",status:c.is_active?"active":"suspended",created:today()};
   db.companies.push(local);
 }else{
   local.code=c.code; local.name=c.name; local.status=c.is_active?"active":"suspended";
 }
 saveDB();
}

async function saveCompany(e,cid){
 e.preventDefault();
 const formButton=e.submitter || document.querySelector('#modal button[type="submit"]');
 const originalText=formButton?.textContent || "💾 حفظ";
 if(formButton){
   formButton.disabled=true;
   formButton.textContent="جاري إنشاء الشركة...";
 }
 try{
   const name=document.getElementById("c_name")?.value.trim() || "";
   const code=document.getElementById("c_code")?.value.trim().toUpperCase() || "";
   const phone=document.getElementById("c_phone")?.value.trim() || "";
   const plan=document.getElementById("c_plan")?.value || "Starter";
   const status=document.getElementById("c_status")?.value || "active";
   const email=document.getElementById("c_email")?.value.trim() || "";
   const startDate=document.getElementById("c_start")?.value || "";
   const endDate=document.getElementById("c_end")?.value || "";
   const address=document.getElementById("c_address")?.value.trim() || "";

   if(!name) throw new Error("اسم الشركة مطلوب");
   if(!code) throw new Error("رمز الشركة مطلوب");

   const {data:{session:authSession},error:sessionError}=await supabaseClient.auth.getSession();
   if(sessionError) throw new Error("خطأ في جلسة Supabase: " + sessionError.message);
   if(!authSession?.access_token) throw new Error("انتهت جلسة الدخول. سجل الدخول كمالك Alyas مرة أخرى.");

   /*
      الأعمدة المستخدمة هنا موجودة في جدول companies بعد تشغيل SQL:
      name, code, phone, subscription_type, is_active.
      لا نرسل email/start/end/address حتى لا يفشل الطلب إذا لم تكن أعمدة موجودة في قاعدة البيانات.
   */
   const payload={
      name:name,
      code:code,
      phone:phone,
      subscription_type:plan,
      is_active:status === "active"
   };

   let result;

   if(!cid){
      result=await supabaseClient
        .from("companies")
        .insert([payload])
        .select("id,name,code,phone,subscription_type,is_active")
        .single();
   }else{
      result=await supabaseClient
        .from("companies")
        .update(payload)
        .eq("id",cid)
        .select("id,name,code,phone,subscription_type,is_active")
        .single();
   }

   const {data,error}=result;

   if(error){
      console.error("Supabase companies error:",error);
      throw new Error(
        "فشل حفظ الشركة في Supabase.\n\n"+
        "الرسالة: " + (error.message || "غير معروف") + "\n"+
        "الكود: " + (error.code || "غير متوفر") + "\n"+
        "التفاصيل: " + (error.details || "غير متوفرة") + "\n"+
        "السبب: " + (error.hint || "غير متوفر")
      );
   }

   if(!data) throw new Error("Supabase لم يرجع بيانات الشركة بعد الحفظ.");

   ensureLocalCompany({
      ...data,
      plan:data.subscription_type || plan,
      start:startDate,
      end:endDate,
      email:email,
      address:address
   });

   logAction(cid ? "تعديل شركة" : "إضافة شركة", name);
   closeModal();
   await syncCompaniesFromSupabase();
   showPage("companies");

   alert(cid ? "تم تعديل الشركة بنجاح في Supabase." : "تم إنشاء الشركة بنجاح في Supabase.");

 }catch(error){
   console.error("Company save error:",error);
   alert(
     "حدث خطأ أثناء حفظ الشركة:\n\n" +
     (error?.message || String(error))
   );
 }finally{
   if(formButton){
      formButton.disabled=false;
      formButton.textContent=originalText;
   }
 }
}

 c.status=c.status==="active"?"suspended":"active";

 db.users=db.users.filter(x=>x.companyId!==cid);
 db.devices=db.devices.filter(x=>x.companyId!==cid);

}

  </div>
 </form>`);
 const createBtn=document.getElementById("createCompanyUserBtn");
 if(createBtn){

async function createCompanyUser(e,companyId){
 if(e && typeof e.preventDefault === "function") e.preventDefault();
 const btn=document.getElementById("createCompanyUserBtn");
 const full_name=document.getElementById("cu_name").value.trim();
 const username=document.getElementById("cu_username").value.trim().toLowerCase();
 const password=document.getElementById("cu_password").value;
 const role=document.getElementById("cu_role").value;
 if(!/^[a-z0-9._-]{3,40}$/.test(username)){
   alert("اسم المستخدم يجب أن يحتوي على أحرف إنجليزية وأرقام و . _ - فقط");
   return;
 }
 if(password.length<8){
   alert("كلمة المرور يجب أن تكون 8 أحرف على الأقل");
   return;
 }
 if(!companyId){
   alert("لم يتم تحديد الشركة");
   return;
 }

 const originalText=btn ? btn.textContent : "💾 إنشاء الحساب";
 if(btn){ btn.disabled=true; btn.textContent="جاري الإنشاء..."; }

 try{
   const {data:sessionData,error:sessionError}=await supabaseClient.auth.getSession();
   if(sessionError) throw new Error("تعذر قراءة جلسة المالك: " + sessionError.message);
   const authSession=sessionData?.session;
   if(!authSession?.access_token) throw new Error("يجب تسجيل الدخول كمالك Alyas أولاً");

   // استخدام Supabase Functions مباشرة مع مهلة حتى لا يبقى الزر عالقاً.
   const controller=new AbortController();
   const timer=setTimeout(()=>controller.abort(),15000);

   let res;
   try{
     res=await fetch(`${SUPABASE_URL}/functions/v1/create-company-user`,{
       method:"POST",
       headers:{
         "Content-Type":"application/json",
         "Authorization":`Bearer ${authSession.access_token}`,
         "apikey":SUPABASE_ANON_KEY
       },
       body:JSON.stringify({company_id:companyId,username,full_name,password,role}),
       signal:controller.signal
     });
   }finally{
     clearTimeout(timer);
   }

   const raw=await res.text();
   let result={};
   try{ result=raw ? JSON.parse(raw) : {}; }catch(_e){ result={raw}; }

   if(!res.ok){
     const detail=result?.error || result?.message || result?.raw || `HTTP ${res.status}`;
     throw new Error("تعذر إنشاء الحساب: " + detail);
   }
   if(result?.success!==true){
     throw new Error(result?.error || result?.message || "لم يؤكد الخادم إنشاء الحساب");
   }

   closeModal();
   alert(`تم إنشاء حساب الشركة بنجاح\n\nاسم المستخدم: ${username}\nرمز الشركة: ${db.companies.find(x=>x.id===companyId)?.code||""}`);

 }catch(err){
   console.error("createCompanyUser error:",err);
   if(err?.name==="AbortError"){
     alert("انتهت مهلة الاتصال بخدمة إنشاء المستخدم.\n\nتأكد من أن Edge Function باسم create-company-user منشورة وتعمل في Supabase.");
   }else{
     alert(err?.message || "حدث خطأ أثناء إنشاء الحساب");
   }
 }finally{
   if(btn){ btn.disabled=false; btn.textContent=originalText; }
 }
}

function backupDB(){
 const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="vendorcare-backup-"+today()+".json";

}

function restoreDB(){
 const input=document.createElement("input");
 input.type="file";
 input.accept=".json";
 input.onchange=()=>{
   const file=input.files[0];
   if(!file)return;

   const reader=new FileReader();
   reader.onload=()=>{
     try{
       const data=JSON.parse(reader.result);

       if(!data.companies || !data.users){
         throw new Error("invalid");
       }

       db=data;
       saveDB();
       alert("تمت استعادة النسخة");
       location.reload();
     }catch(e){
       alert("الملف غير صالح");
     }
   };
   reader.readAsText(file);
 };
 input.click();
}

async function startCamera(){
 try{
  cameraStream=await navigator.mediaDevices.getUserMedia({
   video:{facingMode:"environment"},
   audio:false
  });

  document.getElementById("video").srcObject=cameraStream;
  document.getElementById("cameraMessage").textContent="الكاميرا تعمل الآن";
 }catch(e){
  document.getElementById("cameraMessage").textContent=
   "تعذر تشغيل الكاميرا. تأكد من إعطاء المتصفح صلاحية الكاميرا وأن الموقع يعمل عبر HTTPS.";
 }
}

function stopCamera(){
 if(cameraStream){
  cameraStream.getTracks().forEach(t=>t.stop());
  cameraStream=null;
 }
}

function takePhoto(){
 if(!cameraStream){
  alert("شغل الكاميرا أولاً");
  return;
 }

 const video=document.getElementById("video");
 const canvas=document.getElementById("canvas");

 canvas.width=video.videoWidth;
 canvas.height=video.videoHeight;

 canvas.getContext("2d").drawImage(video,0,0);

 const data=canvas.toDataURL("image/jpeg",.75);

 db.photos.push({
  id:id("photo"),
  companyId:session.companyId,
  data,
  date:new Date().toLocaleString("ar-IQ")
 });

 saveDB();
 logAction("التقاط صورة","Camera");
 showPage("camera");
}

function deletePhoto(pid){
 db.photos=db.photos.filter(x=>x.id!==pid);
 saveDB();
 showPage("camera");
}

function bar(value, label, max) {
    const h = Math.max(5, Math.round(value / max * 100));

    return '<div class="bar" style="height:' + h + 'px"><span>' +
           value + '</span><small>' + label + '</small></div>';
}

function filterTable(tableId,value){
 const table=document.getElementById(tableId);
 if(!table)return;

 const rows=table.querySelectorAll("tr");

 value=value.toLowerCase();

 rows.forEach((row,i)=>{
   if(i===0)return;
   row.style.display=row.innerText.toLowerCase().includes(value)?"":"none";
 });
}
